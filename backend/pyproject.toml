[project]
name = "backend"
version = "0.1.0"
description = "Todo API - FastAPI + SQLite backend"
readme = "README.md"
authors = [
    { name = "Habonit", email = "khk172216@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
